# =============================================================================
# themes.yaml — Tema / sektör parametreleri (themes_v1)
# Kod değiştirmeden buradan yönetilir. Detaylar: docs/THEMES_SPEC.md
#
# fmp_industries listeleri Görev T0'da (2026-09-30) FMP'deki gerçek sanayi isimleriyle
# doğrulandı: 27/27 tam eşleşme (research/themes/fmp_industries_mapping.csv,
# reports/themes/gate_decisions.md). Yükleyici, FMP'de bulunmayan bir sanayi adı
# görürse HATA verir (sessizce atlamaz).
#
# Bu dosya bir araştırma koşusundan önce research/preregistration/ altına
# kopyalanıp hash'lenir. Sonuç görüldükten sonra değiştirilmez; değişiklik =
# yeni sürüm (themes_v2) + docs/CHANGELOG_THEMES.md'ye gerekçe.
# =============================================================================

version: themes_v2                 # arama izi (2026-10-01); themes_v1 ön kayıtlı kopya dondurulmuş

universe:
  exchanges: [NASDAQ, NYSE]
  include_nyse_american: false
  include_adr: false
  include_foreign_filers: false   # 20-F / 40-F dosyalayanlar (ör. Kanadalı enerji) — us-gaap XBRL yok
  min_price: 3.0                  # işlem gören (traded) fiyat
  min_market_cap: 300_000_000
  min_adv20: 5_000_000
  min_history_sessions: 252

classification:
  text_source: edgar_10k_item1    # backtest'te üyelik için TEK geçerli kaynak (PIT)
  forms: [10-K, 10-K405, 10-KT]
  valid_from: acceptance_plus_1_session   # 16:00 ET sonrası kabul → ertesi seans
  valid_until: next_10k_or_18_months      # yeni 10-K yoksa 18 ay sonra üyelik düşer
  match: case_insensitive_substring
  one_theme_per_firm: false        # v2: çoklu tema üyeliği (kullanıcı kararı 2026-10-01)
  primary_subtheme: highest_hit_density   # birden çok alt temaya uyarsa
  theme_tie_priority: [biotech, energy, robotics, semiconductors, ai, cyber_cloud, defense_space]
  review_file: research/themes/membership_review.csv
  live_manual_overrides: true     # include/exclude sadece canlı listede
  backtest_manual_overrides: false

stage:
  # Tüm temalarda: TTM faaliyet nakit akışı <= 0 ise "pre_profit" faktör seti
  pre_profit_rule: ocf_ttm_le_zero
  # Biotech: ürün/toplam gelir TTM bu eşiğin altındaysa "clinical", üstündeyse "commercial"
  biotech_commercial_revenue_usd: 50_000_000

scoring:
  normalization: rank_to_normal          # Φ⁻¹((rank-0.5)/n), tarih bazında
  price_signal_scope: theme              # fiyat sinyalleri tema içinde sıralanır
  accounting_signal_scope: subtheme_if_n_ge_8_else_theme
  group_weights: equal                   # faktör grupları eşit ağırlık, SABİT
  min_coverage: 0.30
  min_weight_present: 0.50

portfolio:
  rebalance: monthly
  weighting: equal                       # tema ağırlığı / n_picks
  hold_buffer: 3.0
  max_share_per_subtheme: 0.5            # bir temanın seçimlerinin en fazla %50'si aynı alt temadan
  position_cap: 0.08
  entry_block_top_vol_pct: 0.03
  costs: default                         # mevcut maliyet modeli (Abdi–Ranaldo dahil)

ta_layer:
  interval_days: 2                       # 2–3 günde bir teknik analiz tablosu
  journal_file: research/ta/trade_journal.csv
  rules_file: research/ta/rules.yaml     # kurallar önceden yazılır, optimize edilmez
  auto_trade: false                      # sadece öneri + günlük; otomatik işlem yok

# -----------------------------------------------------------------------------
# ARAŞTIRMA MODÜLÜ (THEMES_SPEC §7) — ders notlarındaki yönteme göre
# -----------------------------------------------------------------------------
research:
  horizons: [21, 63, 126]                 # seans
  winsorize: [0.005, 0.995]               # ham değerli analizlerde (tanımlayıcı ist., FM ham varyant)
  sort_portfolios:
    n_if_ge_50: 5                         # quintile
    n_if_lt_50: 3                         # tercile (küçük temalar)
  breakpoints: dynamic_per_month          # her ay yeniden; statik eşik yok
  portfolio_weighting: [equal, value]
  alpha_models: [capm, ff3, carhart4, ff5_mom]   # Kenneth French veri kütüphanesi (RF dahil)
  fm_controls: [beta_252d, size_ln_mcap]  # beta günlük veriden, en az 200 gözlem
  fm_variants: [ols_rank_normal, ols_winsorized_raw, wls_sqrt_mcap]
  nw_lags: horizon_div_21_min_1
  corr_redundancy_threshold: 0.7          # aylık kesitsel korelasyonların zaman ortalaması
  vif_threshold: 5
  persistence_lags_months: [1, 3, 6, 12]
  bivariate_sort: dependent               # önce mevcut tema skoru (tercile), sonra yeni faktör
  subperiods: [["2011-07", "2015-12"], ["2016-01", "2020-12"], ["2021-01", "2026-09"]]
  min_names_per_date: 15

# -----------------------------------------------------------------------------
# TEMALAR
# weight toplamı 1.0 olmalı (yükleyici kontrol eder). enabled: false → tema kapalı,
# ağırlığı diğer açık temalara oransal dağıtılır.
# -----------------------------------------------------------------------------
themes:

  robotics:
    enabled: true
    weight: 0.15                   # v2 bütçeleri: 6 tema × 0,15 + savunma/uzay 0,10 (arama bütçeyi arar)
    n_picks: 6
    benchmarks: [ROBO, BOTZ]   # ETF başlangıç tarihlerine dikkat (BOTZ 2016)
    subthemes:
      industrial_automation:
        fmp_industries: ["Industrial - Machinery", "Electrical Equipment & Parts",
                         "Industrial - Specialties"]
        sic: [3559, 3569, 3625, 3823, 3829]
        keywords: ["industrial robot", "robotic", "factory automation", "motion control",
                   "machine vision", "collaborative robot", "cobot",
                   "warehouse automation", "programmable logic controller",
                   # v2 genişletme (2026-10-01, yalnızca sınıflandırma kanıtıyla: log-odds + T3r)
                   "industrial automation", "discrete automation", "process automation", "automation products",
                   "autonomous mobile robot", "humanoid", "robotic arm"]
        min_hits: 3                  # v2: 5 → 3 (aday havuzunda 22 → 47 firma)
      surgical_medical:
        fmp_industries: ["Medical - Devices", "Medical - Instruments & Supplies"]
        sic: [3841, 3842, 3845]
        keywords: ["surgical robot", "robotic surgery", "robotic-assisted",
                   "robotic assisted", "robotic system", "robotic platform",
                   "robot-assisted", "surgical robotics", "robotic surgical"]    # v2 genişletme
        min_hits: 3
      autonomous_drone:
        fmp_industries: ["Auto - Manufacturers", "Auto - Parts", "Aerospace & Defense",
                         "Software - Application", "Software - Infrastructure"]
        sic: [3711, 3714, 3721, 3728, 3812, 7372]
        keywords: ["autonomous vehicle", "autonomous driving", "self-driving", "lidar",
                   "drone", "unmanned aerial", "unmanned aircraft", "robotaxi",
                   "unmanned systems", "uncrewed", "driverless", "unmanned ground"]   # v2 genişletme
        min_hits: 10                 # Kapı 2 revizyonu (2026-09-30): 5 → 10, bkz. docs/CHANGELOG_THEMES.md
      components:
        fmp_industries: ["Semiconductors", "Hardware, Equipment & Parts",
                         "Electrical Equipment & Parts"]
        sic: [3621, 3674, 3679, 3825, 3829]
        keywords: ["robot"]        # "robotic", "robotics" da eşleşir
        min_hits: 5                # v2: 8 → 5 (aday havuzunda ~10 → 22 firma); genel çip firmaları hâlâ elenir

  biotech:
    enabled: true
    weight: 0.15
    n_picks: 6
    benchmarks: [XBI, IBB]
    split: stage                   # clinical vs commercial ayrı faktör seti
    subthemes:
      biotech_all:
        fmp_industries: ["Biotechnology", "Drug Manufacturers - Specialty & Generic"]
        sic: [2834, 2835, 2836, 8731]
        keywords: []               # sanayi/SIC yeterli
        min_hits: 0

  energy:
    enabled: true
    weight: 0.15
    n_picks: 6
    benchmarks: [XLE, XLU, ICLN]
    subthemes:
      oil_gas:
        fmp_industries: ["Oil & Gas Exploration & Production", "Oil & Gas Integrated",
                         "Oil & Gas Midstream", "Oil & Gas Equipment & Services",
                         "Oil & Gas Refining & Marketing"]
        sic: [1311, 1381, 1382, 1389, 2911, 4922, 4923]
        keywords: []
        min_hits: 0
      power_utilities:
        fmp_industries: ["Regulated Electric", "Independent Power Producers",
                         "Diversified Utilities"]
        sic: [4911, 4931, 4991]
        keywords: []
        min_hits: 0
      nuclear_uranium:
        fmp_industries: ["Uranium"]
        sic: [1094, 4911]
        keywords: ["uranium", "nuclear fuel", "small modular reactor", "nuclear reactor"]
        min_hits: 3
      grid_equipment:
        fmp_industries: ["Electrical Equipment & Parts"]
        sic: [3612, 3613, 3621]
        keywords: ["transmission", "switchgear", "transformer", "power grid",
                   "data center power", "electrical infrastructure"]
        min_hits: 5
      renewables:
        fmp_industries: ["Solar", "Renewable Utilities"]
        sic: [3674, 4911, 4991]
        keywords: ["solar", "photovoltaic", "wind turbine", "energy storage",
                   "battery storage", "hydrogen", "fuel cell", "geothermal"]
        min_hits: 5

  # ---------------------------------------------------------------------------
  # v2 genişleme (kullanıcı kararı 2026-10-01): AI, yarı iletken, siber+bulut, savunma/uzay/kuantum.
  # Geniş kapsama + metin kontrolü: aday havuzu (sanayi/SIC) içinde 10-K Item 1 anahtar kelime eşiği; düşük
  # eşikler yüksek geri çağırma içindir, isabet T3r ile ölçülür. Çoklu tema üyeliği açık.
  # ---------------------------------------------------------------------------
  ai:
    enabled: true
    weight: 0.15
    n_picks: 6
    benchmarks: [AIQ]
    subthemes:
      ai_compute:
        fmp_industries: ["Semiconductors", "Computer Hardware", "Hardware, Equipment & Parts",
                         "Communication Equipment"]
        sic: [3571, 3572, 3576, 3577, 3661, 3663, 3672, 3674]
        keywords: ["artificial intelligence", "machine learning", "generative ai", "accelerated computing",
                   "large language model", "neural network", "ai accelerator", "ai workloads", "ai inference",
                   "ai training"]
        min_hits: 2
      ai_infrastructure:
        fmp_industries: ["Electrical Equipment & Parts", "Industrial - Machinery", "Engineering & Construction",
                         "Information Technology Services", "Telecommunications Services", "REIT - Specialty",
                         "Computer Hardware", "Communication Equipment"]
        sic: [1731, 3585, 3612, 3613, 3621, 4813, 6798, 7374]
        keywords: ["data center", "artificial intelligence", "ai workloads", "high-performance computing",
                   "hyperscale", "liquid cooling", "ai infrastructure"]
        min_hits: 3
      ai_software:
        fmp_industries: ["Software - Application", "Software - Infrastructure", "Software - Services",
                         "Internet Content & Information", "Information Technology Services",
                         "Electronic Gaming & Multimedia", "Advertising Agencies"]
        sic: [7370, 7371, 7372, 7373, 7374]
        keywords: ["artificial intelligence", "machine learning", "generative ai", "large language model",
                   "ai-powered", "ai platform", "ai models", "ai agents", "agentic", "computer vision",
                   "natural language processing"]
        min_hits: 3

  semiconductors:
    enabled: true
    weight: 0.15
    n_picks: 6
    benchmarks: [SMH, SOXX]
    subthemes:
      semis_all:
        fmp_industries: ["Semiconductors"]
        sic: [3674]
        keywords: []               # sanayi/SIC yeterli: tüm yarı iletken firmaları
        min_hits: 0
      semi_equipment:
        fmp_industries: ["Industrial - Machinery", "Hardware, Equipment & Parts", "Electrical Equipment & Parts",
                         "Technology Distributors"]
        sic: [3559, 3699, 3825, 3827, 3829]
        keywords: ["semiconductor", "wafer", "lithography", "wafer fab", "photomask"]
        min_hits: 5

  cyber_cloud:
    enabled: true
    weight: 0.15
    n_picks: 6
    benchmarks: [CIBR, SKYY, IGV]
    subthemes:
      cybersecurity:
        fmp_industries: ["Software - Infrastructure", "Software - Application", "Information Technology Services",
                         "Security & Protection Services", "Communication Equipment"]
        sic: [3577, 7372, 7373, 7374]
        keywords: ["cybersecurity", "cyber security", "threat detection", "zero trust", "endpoint security",
                   "firewall", "identity security", "security operations", "threat intelligence",
                   "network security"]
        min_hits: 5
      cloud_saas:
        fmp_industries: ["Software - Application", "Software - Infrastructure", "Software - Services",
