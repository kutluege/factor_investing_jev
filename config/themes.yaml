        sic: [7370, 7371, 7372, 7373, 7374]
        keywords: ["software-as-a-service", "saas", "cloud-based", "cloud platform", "subscription revenue",
                   "multi-tenant", "cloud infrastructure", "cloud computing"]
        min_hits: 3

  defense_space:
    enabled: true
    weight: 0.10
    n_picks: 6
    benchmarks: [ITA, UFO, QTUM]
    subthemes:
      defense:
        fmp_industries: ["Aerospace & Defense", "Security & Protection Services", "Communication Equipment",
                         "Information Technology Services", "Engineering & Construction"]
        sic: [3480, 3482, 3483, 3484, 3489, 3721, 3724, 3728, 3760, 3761, 3795, 3812, 8711]
        keywords: ["department of defense", "u.s. army", "u.s. navy", "u.s. air force", "military", "defense"]
        min_hits: 5
      space:
        fmp_industries: ["Aerospace & Defense", "Communication Equipment", "Telecommunications Services",
                         "Information Technology Services", "Hardware, Equipment & Parts"]
        sic: [3663, 3760, 3761, 3764, 3769, 3812, 4899]
        keywords: ["satellite", "spacecraft", "launch vehicle", "low earth orbit", "space station", "in-orbit",
                   "space-based"]
        min_hits: 5
      quantum:
        fmp_industries: ["Computer Hardware", "Software - Infrastructure", "Semiconductors",
                         "Hardware, Equipment & Parts", "Information Technology Services"]
        sic: [3571, 3572, 3577, 3674, 7372, 7373]
        keywords: ["quantum computing", "quantum computer", "qubit", "quantum processor"]
        min_hits: 3

# -----------------------------------------------------------------------------
# FAKTÖR SETLERİ (literatüre dayalı, sonuç görülmeden SABİTLENDİ)
# "-" öneki: düşük değer iyi. Grup içi ortalama → gruplar eşit ağırlık.
# -----------------------------------------------------------------------------
factor_groups:
  momentum:        [mom_12_1, dist_52w_high]
  low_risk:        [-idio_vol_60d, -max_ret_21d]
  investment:      [-share_issuance, -asset_growth, -capex_at]
  quality:         [gross_profitability, cop_at]
  value:           [ebit_ev, ocf_ev]
  fundamental_mom: [sue, droe]
  growth_quality:  [profitable_growth]
  survival:        [cash_runway_years]
  leverage:        [-net_debt_ebitda]
  commodity:       [oil_beta_trend]
  earnings_event:  [ear_3d, sue_announce]     # T4b: FMP earnings endpoint doğrulanınca

factor_sets:
  pre_profit:         [momentum, low_risk, investment, survival]
  profitable_general: [momentum, low_risk, investment, quality, fundamental_mom, growth_quality]
  biotech_commercial: [momentum, low_risk, investment, quality, fundamental_mom]
  energy_profitable:  [momentum, low_risk, investment, quality, value, leverage]

theme_factor_map:
  robotics:
    pre_profit: pre_profit
    profitable: profitable_general
  biotech:
    clinical: pre_profit
    commercial: biotech_commercial
  energy:
    pre_profit: pre_profit
    profitable: energy_profitable
    subtheme_extra:
      oil_gas: [commodity]          # sadece petrol/gaz alt temasında
  ai:
    pre_profit: pre_profit
    profitable: profitable_general
  semiconductors:
    pre_profit: pre_profit
    profitable: profitable_general
  cyber_cloud:
    pre_profit: pre_profit
    profitable: profitable_general
  defense_space:
    pre_profit: pre_profit
    profitable: profitable_general
