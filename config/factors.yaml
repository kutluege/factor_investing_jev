# Candidate features grouped into factor families. direction: +1 higher is better, -1 lower is better.
# applies_to: sector groups where the feature is meaningful (omit = all groups).
families:
  value:
    earnings_yield:        {direction: 1, exclude_groups: [biotechnology]}
    fcf_yield:             {direction: 1}
    ebit_ev:               {direction: 1, exclude_groups: [biotechnology]}
    sales_ev:              {direction: 1}
    book_to_market:        {direction: 1}
    cash_to_mcap:          {direction: 1, only_groups: [biotechnology]}
  quality:
    roic:                  {direction: 1, exclude_groups: [biotechnology]}
    roe:                   {direction: 1, exclude_groups: [biotechnology]}
    roa:                   {direction: 1}
    gross_profitability:   {direction: 1}
    operating_margin:      {direction: 1, exclude_groups: [biotechnology]}
    fcf_margin:            {direction: 1, exclude_groups: [biotechnology]}
    cash_conversion:       {direction: 1, exclude_groups: [biotechnology]}
    debt_to_assets:        {direction: -1}
    net_debt_to_assets:    {direction: -1}
    interest_coverage:     {direction: 1, exclude_groups: [biotechnology]}
    cash_runway_years:     {direction: 1, only_groups: [biotechnology]}
    rd_intensity:          {direction: 1, only_groups: [biotechnology]}
  growth:
    revenue_yoy:           {direction: 1}
    revenue_cagr_2y:       {direction: 1}
    eps_growth:            {direction: 1, exclude_groups: [biotechnology]}
    ebitda_growth:         {direction: 1, exclude_groups: [biotechnology]}
    fcf_growth:            {direction: 1, exclude_groups: [biotechnology]}
    gross_profit_growth:   {direction: 1}
  fundamental_momentum:
    revenue_growth_accel:  {direction: 1}
    operating_margin_chg:  {direction: 1, exclude_groups: [biotechnology]}
    roic_chg:              {direction: 1, exclude_groups: [biotechnology]}
    fcf_margin_chg:        {direction: 1, exclude_groups: [biotechnology]}
    eps_accel:             {direction: 1, exclude_groups: [biotechnology]}
    leverage_chg:          {direction: -1}
    share_dilution_yoy:    {direction: -1}
  price_momentum:
    ret_3m:                {direction: 1}
    ret_6m:                {direction: 1}
    mom_6_1:               {direction: 1}
    mom_12_1:              {direction: 1}
    rs_qqq_6m:             {direction: 1}
    rs_sector_6m:          {direction: 1}
    dist_52w_high:         {direction: 1}
  technical_trend:
    price_sma200:          {direction: 1}
    sma50_sma200:          {direction: 1}
    macd_hist_norm:        {direction: 1}
    adx14_trend:           {direction: 1}
    breakout_60d:          {direction: 1}
    volume_ratio_20d:      {direction: 1}
  risk:
    vol_60d:               {direction: -1}
    vol_20d:               {direction: -1}
    atr14_pct:             {direction: -1}
    beta_qqq_252d:         {direction: -1}
    max_dd_252d:           {direction: 1}   # max drawdown is negative; closer to zero is better

preprocessing:
  winsorize_mad: 5.0          # clip robust z at +/- this many scaled MADs before re-standardizing
  min_coverage: 0.30          # feature is dropped at a rebalance if fewer than this share of names have it
  min_features_per_family: 1  # a name needs at least this many features to receive a family score
  sector_relative: true       # normalize within sector group when the group has enough names
  min_group_size: 8           # below this, fall back to universe-wide normalization

# Forward targets for research diagnostics (trading days).
horizons: [63, 126]
