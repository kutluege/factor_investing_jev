# Factor model v2: literature-grounded themes (see docs/RESEARCH.md for sources and exact definitions).
# direction: +1 higher is better, -1 lower is better.
# only_groups / exclude_groups: sector groups where the characteristic is meaningful.
# scope: sector (rank within sector group; default for accounting ratios) | universe (rank across all names;
#        used for price-based signals, per the literature).
# Technical-analysis indicators are deliberately NOT part of the model: the user applies technical analysis
# separately. They are still computed and stored for display (technical_values).
version: 2
families:
  momentum:
    res_mom_12_2:     {direction: 1, scope: universe}   # Blitz, Huij & Martens (2011) residual momentum
    dist_52w_high:    {direction: 1, scope: universe}   # George & Hwang (2004)
    mom_12_1:         {direction: 1, scope: universe}   # Jegadeesh & Titman (1993)
    mom_12_7:         {direction: 1, scope: universe}   # Novy-Marx (2012) intermediate momentum
    sector_mom_6m:    {direction: 1, scope: universe, only_groups: [energy, metals_mining]}  # industry momentum
  quality:
    cop_at:           {direction: 1}                    # Ball et al. (2016) cash-based operating profitability
    gross_profitability: {direction: 1}                 # Novy-Marx (2013) GP / assets
    fscore:           {direction: 1, exclude_groups: [biotechnology]}  # Piotroski (2000)
  investment:
    asset_growth:     {direction: -1}                   # Cooper, Gulen & Schill (2008)
    share_issuance:   {direction: -1}                   # Pontiff & Woodgate (2008)
    cash_runway_years: {direction: 1, only_groups: [biotechnology]}    # dilution-risk proxy for cash burners
  value:
    ebit_ev:          {direction: 1, exclude_groups: [biotechnology]}
    ocf_ev:           {direction: 1, exclude_groups: [biotechnology]}
    book_to_market:   {direction: 1}
    rd_intensity:     {direction: 1, only_groups: [technology, biotechnology]}  # Chan, Lakonishok & Sougiannis (2001)
    cash_to_mcap:     {direction: 1, only_groups: [biotechnology]}
  fundamental_momentum:
    droe:             {direction: 1, exclude_groups: [biotechnology]}  # Hou, Mo, Xue & Zhang (2021)
    sue:              {direction: 1}                    # standardized unexpected earnings (seasonal random walk)
  low_risk:
    max_ret_21d:      {direction: -1, scope: universe}  # Bali, Cakici & Whitelaw (2011) MAX
    idio_vol_60d:     {direction: -1, scope: universe}  # Ang et al. (2006)
  growth:                                               # weak in the literature; zero weight in core presets
    revenue_yoy:      {direction: 1}
    gross_profit_growth: {direction: 1}

preprocessing:
  transform: rank             # rank -> normal scores (robust to outliers); alternative: robust_z
  winsorize_mad: 5.0          # used when transform = robust_z
  min_coverage: 0.30          # a characteristic is dropped at a rebalance if fewer than this share of names have it
  min_features_per_family: 1  # a name needs at least this many characteristics to receive a family score
  sector_relative: true       # accounting characteristics are ranked within sector group
  min_group_size: 8           # below this, fall back to universe-wide ranking

# Forward labels for research diagnostics and factor-momentum tilts (trading days).
horizons: [21, 63, 126]
