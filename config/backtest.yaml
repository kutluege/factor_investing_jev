# Research search space and backtest assumptions (v2). Everything here is visible in reports and saved per run.
initial_capital_usd: 10000
start_date: "2011-06-30"        # SEC XBRL covers most filers from mid-2011; earlier dates lack fundamentals
end_date: null                  # null = latest stored price date
rebalance_frequency: monthly    # last trading day of each month
execution: next_open            # signals computed on close of D, traded at the next session open

costs:
  commission_per_trade_usd: 1.0 # conservative even for commission-free brokers
  slippage_bps: 10              # minimum adverse slippage on the execution price
  spread_cost: true             # additionally pay half the estimated bid-ask spread (Abdi-Ranaldo, 60 sessions)
  max_spread_cost_bps: 200      # cap on the spread component per trade
  transaction_cost_bps: 5       # fees / impact allowance on traded notional
  delisting_haircut: 0.0        # loss applied to the last price when a held stock stops trading (e.g. merger)
  # Performance (distress) delistings: Shumway (1997) / Shumway & Warther (1999) find average NASDAQ
  # performance-delisting returns of -30% to -55% after the last exchange price. A stock whose last traded price is
  # below distress_price or that fell more than distress_drawdown over its last 126 sessions is treated as a distress
  # delisting and loses distress_haircut on its last price.
  distress_haircut: 0.30
  distress_price: 2.0
  distress_drawdown: 0.60

portfolio:
  max_position_weight: 0.08     # effective cap = max(this, 1.5 / N)
  max_sector_weight: 0.45       # sector-group cap (relaxed when fewer sectors are available)
  drift_band: 0.25              # re-trade a kept position only if |current-target|/target exceeds this
  min_trade_usd: 150            # skip rebalancing trims/top-ups smaller than this
  wait_rank_multiple: 2.0       # non-owned names ranked <= N * this (but not BUY) are shown as WAIT
  replace_rank_fraction: 0.5    # a non-owned name ranked <= N * this may replace a holding outside the top N
  min_holding_days_for_rank_exit: 0
  entry_gates:
    max_vol60_percentile: 0.97  # do not BUY the most volatile 3% of the universe (lottery / distress)
    require_above_sma200: false # technical analysis is left to the user
    min_jev_confidence: null
  exit_rules:
    technical_breakdown: false  # technical analysis is left to the user
    breakdown_pct: 0.10
    fundamental_deterioration_pct: 0.10   # quality AND fundamental-momentum percentiles both below this

search:
  seed: 42
  defaults:
    min_market_cap: 300000000
    min_adv20: 5000000
    portfolio_size: 20
    weighting: equal
    hold_buffer: 3.0
  market_caps: [100000000, 300000000, 500000000, 1000000000]
  adv_thresholds: [1000000, 5000000, 10000000, 20000000]
  portfolio_sizes: [5, 10, 15, 20, 25, 30]
  weightings: [equal, score, inverse_vol, score_inverse_vol]
  jev_weights: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  hold_buffers: [1.0, 1.5, 2.0, 3.0, 4.0]
  cost_multipliers: [0.0, 1.0, 2.0, 3.0]   # sensitivity only; never used for selection
  # Stage 2: seeded random sample of the full grid. It does not depend on any results, so nested walk-forward
  # selection over Stage 1 + Stage 2 candidates is not contaminated by full-sample performance.
  random_configs: 160

# Theme weights. "literature" follows the published-evidence synthesis in docs/RESEARCH.md; the others are
# deliberately few, interpretable alternatives (no free-form weight optimisation).
family_presets:
  literature:        {momentum: 30, quality: 25, investment: 20, value: 15, fundamental_momentum: 5, low_risk: 5}
  equal_themes:      {momentum: 1, quality: 1, investment: 1, value: 1, fundamental_momentum: 1, low_risk: 1}
  momentum_quality:  {momentum: 40, quality: 30, investment: 15, value: 5, fundamental_momentum: 5, low_risk: 5}
  quality_value:     {momentum: 10, quality: 30, investment: 20, value: 30, fundamental_momentum: 5, low_risk: 5}
  defensive:         {momentum: 15, quality: 35, investment: 25, value: 10, fundamental_momentum: 0, low_risk: 15}
  momentum_only:     {momentum: 1}
  # Factor momentum (Ehsani & Linnainmaa 2022): tilt the literature weights by at most +/-30% toward themes whose
  # top-quintile excess return over the trailing 12 matured months was positive.
  literature_factor_momentum: {dynamic: factor_momentum, base: literature, tilt: 0.3, lookback_months: 12, horizon: 21}
  # IC weights shrunk 50% toward the literature weights (only fully matured 126-day labels are used).
  literature_ic_shrunk: {dynamic: ic, base: literature, shrink: 0.5, horizon: 126, lookback_months: 36, min_obs: 12}

walk_forward:
  min_train_months: 36
  test_months: 12
  embargo_months: 1             # gap between the last training rebalance and the first test rebalance
  purge_label_days: 126         # training labels that end after the test start are dropped

objective:
  weights:
    median_cagr: 0.35
    medium_horizon_return: 0.15   # mean of median 3m and median 6m rolling returns
    median_calmar: 0.15
    median_sharpe: 0.10
    median_drawdown_quality: 0.15
    worst_drawdown_quality: 0.10
  turnover_penalty: 0.05          # per unit of robust-z annual turnover
  min_folds_for_selection: 2

promotion:
  min_objective_improvement: 0.25
  min_fold_win_rate: 0.6
  max_worst_dd_deterioration: 0.05
  min_months_between_promotions: 3

diagnostics:
  max_missing_fundamental_share: 0.5
  min_universe_size: 30
  max_single_stock_contribution: 0.5
  max_single_sector_weight: 0.8
  max_annual_turnover: 6.0
  microcap_threshold: 300000000
  max_microcap_weight: 0.5
  min_months: 24
  min_folds: 3
