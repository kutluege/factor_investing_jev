[project]
name = "jev-factor-investor"
version = "0.1.0"
description = "Point-in-time US equity factor research and portfolio ranking with Jev structured decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.1",
    "pyarrow>=16",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that hit real external APIs (deselected by default in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults are the documented idiom
